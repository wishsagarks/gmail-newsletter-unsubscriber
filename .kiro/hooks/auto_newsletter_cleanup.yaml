name: auto_newsletter_cleanup
description: Automatically run newsletter unsubscriber bi-weekly

trigger:
  type: schedule
  schedule:
    cron: "0 9 */14 * *"
    timezone: "America/Los_Angeles"

action:
  type: workflow
  workflow: scan_and_unsubscribe_gmail

message: |
  🧹 Running bi-weekly newsletter cleanup...
  
  Scanning your Gmail for newsletters and unsubscribing automatically.

enabled: false
notify_on_completion: true
